<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Il Post - The Printed Book</title>
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>

  <!-- NUOVA COPERTINA (montagna + MASTERPOST + timeline + scorri giù) -->
  <section class="cover-section" id="cover-section">
    <div class="cover-hero">
      <div class="cover-container">
        <h1 class="cover-title">MASTERPOST</h1>
        <div class="cover-timeline-wrapper" id="coverTimelineWrapper">
          <div class="cover-timeline-bar" id="coverTimelineBar"></div>
          <div class="cover-timeline-indicator" id="coverIndicator"></div>
        </div>
        <button class="cover-scroll-button" onclick="scrollToMain()">
          scorri giù ↓
        </button>
      </div>
    </div>
  </section>

  <!-- CONTENITORE PRINCIPALE (header + subheader + masterpost + home view) -->
  <div class="main-wrapper" id="main-wrapper">
    <header class="top-header">
      <h1 class="header-logo">Il Post</h1>
      <h1 class="header-title">La Guerra USA-Iran (2026)</h1>
      <div class="header-right"></div>
    </header>

    <div class="subheader" id="subheader">
      <div class="subheader-filters">
        <button class="filter-btn active" data-filter="all">Attacchi militari</button>
        <button class="filter-btn" data-filter="technology">Diplomazia</button>
        <button class="filter-btn" data-filter="cultural">Dichiarazioni ufficiali</button>
        <button class="filter-btn" data-filter="business">Stretto di Hormuz</button>
        <button class="filter-btn" data-filter="business">Vita in Iran</button>
      </div>
    </div>

    <div class="main-content">
      <div class="sidebar">
        <header class="editorial-header">
          <span class="pub-meta">Masterpost</span>
          <p class="subtitle">From clay tablets to digital ink: a history of human knowledge transmission.</p>
        </header>
        <div class="timeline-bar" id="timeline-bar"></div>
      </div>

      <main class="article-area" id="article-area"></main>

      <div class="mobile-timeline" id="mobile-timeline"></div>
    </div>

    <div class="home-view" id="home-view" style="display: none;">
      <button class="back-button" id="back-button">← Back to Timeline</button>
      <div class="newspaper-layout">
        <!-- (contenuto fittizio invariato) -->
        <div class="featured-article">
          <div class="featured-placeholder"></div>
          <div class="featured-text">
            <div class="featured-headline"></div>
            <div class="featured-description"></div>
          </div>
        </div>
        <div class="grid-articles">
          <div class="grid-item large"><div class="article-image"></div><div class="article-headline"></div><div class="article-snippet"></div></div>
          <div class="grid-item"><div class="article-image"></div><div class="article-headline"></div><div class="article-snippet"></div></div>
          <div class="grid-item"><div class="article-image"></div><div class="article-headline"></div><div class="article-snippet"></div></div>
          <div class="grid-item"><div class="article-image"></div><div class="article-headline"></div><div class="article-snippet"></div></div>
          <div class="grid-item"><div class="article-image"></div><div class="article-headline"></div><div class="article-snippet"></div></div>
          <div class="grid-item large"><div class="article-image"></div><div class="article-headline"></div><div class="article-snippet"></div></div>
        </div>
        <div class="sidebar-ads">
          <div class="ad-block"></div>
          <div class="ad-block"></div>
          <div class="ad-block"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- COPERTINA INIZIALE (immagine + due pulsanti) -->
  <div id="initial-cover" class="initial-cover">
    <!-- Cerchio invisibile che si espanderà al click -->
    <div id="transition-ripple" class="transition-ripple"></div>
    <!-- pulsante, ora trasparente -->

    <button id="masterpost-button" onclick="triggerCoverAnimation()">MasterPost Guerra Usa Iran</button>

  </div>

  <script src="script.js?v=7"></script>
</body>
</html>
