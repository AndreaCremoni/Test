<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Il Post - The Printed Book</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <header class="top-header">
    <div class="header-left">
      <h1 class="header-logo">Il Post</h1>
    </div>
    <h1 class="header-title">The Printed Book</h1>
    <div class="header-right"></div>
  </header>

  <div class="subheader" id="subheader">
    <div class="subheader-filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="technology">Technology</button>
      <button class="filter-btn" data-filter="cultural">Cultural Impact</button>
      <button class="filter-btn" data-filter="business">Business</button>
    </div>
  </div>

  <div class="main-content">
    <div class="sidebar">
      <header class="editorial-header">
        <span class="pub-meta">Chronological Journal</span>
        <p class="subtitle">From clay tablets to digital ink: a history of human knowledge transmission.</p>
      </header>
      
      <div class="timeline-bar" id="timeline-bar">
        <!-- Timeline lines dynamically generated by JS -->
      </div>
    </div>

    <main class="article-area" id="article-area">
      <!-- Article cards dynamically generated by JS -->
    </main>

    <div class="mobile-timeline" id="mobile-timeline">
      <!-- Mobile-friendly timeline generated by JS -->
    </div>
  </div>

  <!-- Home View (hidden by default) -->
  <div class="home-view" id="home-view" style="display: none;">
    <button class="back-button" id="back-button">← Back to Timeline</button>
    
    <div class="newspaper-layout">
      <div class="featured-article">
        <div class="featured-placeholder"></div>
        <div class="featured-text">
          <div class="featured-headline"></div>
          <div class="featured-description"></div>
        </div>
      </div>

      <div class="grid-articles">
        <div class="grid-item large">
          <div class="article-image"></div>
          <div class="article-headline"></div>
          <div class="article-snippet"></div>
        </div>

        <div class="grid-item">
          <div class="article-image"></div>
          <div class="article-headline"></div>
          <div class="article-snippet"></div>
        </div>

        <div class="grid-item">
          <div class="article-image"></div>
          <div class="article-headline"></div>
          <div class="article-snippet"></div>
        </div>

        <div class="grid-item">
          <div class="article-image"></div>
          <div class="article-headline"></div>
          <div class="article-snippet"></div>
        </div>

        <div class="grid-item">
          <div class="article-image"></div>
          <div class="article-headline"></div>
          <div class="article-snippet"></div>
        </div>

        <div class="grid-item large">
          <div class="article-image"></div>
          <div class="article-headline"></div>
          <div class="article-snippet"></div>
        </div>
      </div>

      <div class="sidebar-ads">
        <div class="ad-block"></div>
        <div class="ad-block"></div>
        <div class="ad-block"></div>
      </div>
    </div>
  </div>

  <script src="script.js?v=4"></script>
</body>
</html>
